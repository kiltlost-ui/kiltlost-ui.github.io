<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MISIS Student Enrollment</title>
<style>
:root{--pri:#1e4fa3;--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mut:#5b6b88;--bd:#dbe3f0;--ok:#1a8f4c;--bad:#c62f3a;--side:#0f2447;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#162036;--tx:#e8eefc;--mut:#9fb0d0;--bd:#26344f;--side:#080e1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1220;--card:#162036;--tx:#e8eefc;--mut:#9fb0d0;--bd:#26344f;--side:#080e1c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:60}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;transition:background .4s}
#top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fade .4s}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer;transition:transform .2s}.ib:active{transform:scale(.9)}
.sw{display:flex;gap:6px}.sw i{width:20px;height:20px;border-radius:50%;border:2px solid #fff8;cursor:pointer;transition:transform .2s}.sw i:hover{transform:scale(1.25)}
img.logo{width:36px;height:36px;border-radius:50%;background:#fff;object-fit:contain}
#side{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--side);color:#fff;z-index:80;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 16px;overflow-y:auto;touch-action:pan-y}
#side.open{transform:none;box-shadow:6px 0 30px #0006}
#ov{position:fixed;inset:0;background:#0008;z-index:70;opacity:0;pointer-events:none;transition:opacity .3s}#ov.on{opacity:1;pointer-events:auto}
.brand{text-align:center;padding:6px 6px 16px;border-bottom:1px solid #fff2;margin-bottom:10px}.brand img{width:96px;height:96px;border-radius:50%;background:#fff;object-fit:contain;animation:pop .7s}
.brand b{display:block;margin-top:8px;font-size:14px}.brand small{opacity:.7}
.nav{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:#dce6ff;padding:11px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left;transition:background .2s,transform .2s}
.nav:hover{background:#fff1;transform:translateX(4px)}.nav.on{background:var(--pri);color:#fff}
main{padding:16px;max-width:1100px;margin:auto;animation:fade .45s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;animation:up .5s both}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border-radius:14px;padding:16px;color:#fff;background:var(--pri);animation:up .5s both;transition:transform .2s}.stat:hover{transform:translateY(-4px)}
.stat b{font-size:30px;display:block}
.f{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri)}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}
.btn.g{background:var(--bd);color:var(--tx)}.btn.r{background:var(--bad)}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps div{flex:1;height:7px;border-radius:4px;background:var(--bd);transition:background .4s}.steps .on{background:var(--pri)}
.doc{border:2px dashed var(--bd);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;transition:border-color .3s}.doc.has{border-style:solid;border-color:var(--ok)}
.doc img{width:56px;height:56px;object-fit:cover;border-radius:8px}.doc div{flex:1;min-width:0}.req{color:var(--bad)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:9px;border-bottom:1px solid var(--bd);text-align:left}th{font-size:12px;color:var(--mut);text-transform:uppercase}
tr.row{animation:fade .4s both}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:var(--ok)}a.nav{text-decoration:none}.tag.p{background:#d68a00}.tag.x{background:var(--bad)}
.chip{background:#f5b301;color:#1a1a1a;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.5px}.chip:empty{display:none}
body.adm #top,body.adm::before{background:#0b1b3a}body.adm #side{background:linear-gradient(180deg,#0b1b3a,#24124d)}body.adm .nav.on{background:#f5b301;color:#1a1a1a;font-weight:700}body.adm .brand small{color:#f5b301;opacity:1;font-weight:700}
#dlg{position:fixed;inset:0;background:#000a;z-index:90;display:none;align-items:center;justify-content:center;padding:14px}#dlg.on{display:flex}
#dlg>div{background:var(--card);max-width:640px;width:100%;max-height:90vh;overflow:auto;border-radius:16px;padding:18px;animation:pop .35s}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ok);color:#fff;padding:12px 20px;border-radius:12px;z-index:99;transition:transform .4s;max-width:90vw}#toast.on{transform:translate(-50%,0)}
.stars button{background:none;border:0;font-size:26px;cursor:pointer;color:#c9a100;padding:0 2px}
h2{margin:.2em 0 .6em;font-size:20px}h3{margin:.2em 0 .6em}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0;transform:scale(.8)}}
@media(min-width:900px){#side{transform:none;box-shadow:none}#ov{display:none}#top,main{margin-left:260px}#top #mb{display:none}body::before{left:0}}
@media print{#top,#side,.noprint{display:none!important}#top,main{margin:0}}
body{background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--pri) 12%,var(--bg)));background-attachment:fixed}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg) center 45%/min(80vmin,640px) no-repeat;opacity:.11}
:root[data-theme="dark"] body::after{opacity:.06}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) body::after{opacity:.06}}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(8px);box-shadow:0 8px 30px #0b1b3a14}
.btn{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 65%,#000))}.btn.g{background:var(--bd)}.btn.r{background:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:12px}.hero img{width:64px;height:64px;box-shadow:0 4px 14px #0003}.hero h2{margin:0}.hero small{color:var(--mut)}
.stp{display:flex;margin:4px 0 18px}.stp .s{flex:1;text-align:center;position:relative;font-size:12px;color:var(--mut)}
.stp .s::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--bd)}.stp .s:first-child::before{display:none}
.stp .s b{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 4px;border-radius:50%;background:var(--bd);color:var(--tx);transition:all .3s}
.stp .d b,.stp .c b{background:var(--pri);color:#fff}.stp .d::before,.stp .c::before{background:var(--pri)}.stp .c b{box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 25%,transparent);animation:pop .4s}.stp .c{color:var(--tx);font-weight:700}
.prep{background:color-mix(in srgb,var(--pri) 10%,transparent);border-left:4px solid var(--pri);border-radius:10px;padding:10px 14px;margin-bottom:14px}.prep ul{margin:6px 0 0;padding-left:20px;columns:2 220px}
.hint{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:3px}
input.bad,select.bad{border-color:var(--bad);animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fm{animation:fade .35s}.rev div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}.rev span{color:var(--mut)}.rev b{text-align:right}
.warn{color:#b45309;background:#fef3c7;padding:10px;border-radius:10px}.ok{color:var(--ok);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer;font-weight:400}.chk input{width:20px;margin:2px 0 0}
.nb{display:flex;gap:10px;margin-top:18px;justify-content:space-between}.no{color:var(--pri);margin:.1em 0;letter-spacing:1px;word-break:break-all}
</style></head><body>

<aside id="side"><div class="brand"><img class="logo" alt="School logo"><b>Manuel I. Santos Integrated School</b><small>Computerized Enrollment System</small></div><div id="nav"></div><a class="nav" href="admin.html">🔒 Registrar Panel</a></aside>

<div class="sw" id="sw"></div><button class="ib" id="dk" aria-label="Dark mode">🌓</button></header>
<main id="v"></main><div id="dlg"><div id="dc"></div></div><div id="toast"></div>

let mem={};
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v;if(String(e).match(/quota/i))toast("Storage is full; remove some records.",1)}}};
const $=s=>document.querySelector(s);
const NAV=[["dash","🏠","Dashboard"],["enroll","📝","Enroll a Student"],["appr","✅","Approvals"],["list","👩‍🎓","Enrolled Students"],["eval","⭐","System Evaluation"],["set","⚙️","Settings & Export"]];
let LG="",LS="";const GR=["Grade 7","Grade 8","Grade 9","Grade 10","Grade 11","Grade 12"];
const DOCS=[["psa","PSA Birth Certificate",1],["sid","Student ID or LRN slip",1],["pid","Parent/Guardian valid ID",1],["rc","Report Card (Form 138)",1],["gm","Good Moral Certificate",0],["ph","2×2 ID Photo",0]];
const COLS=["#1e4fa3","#0b8457","#7b2cbf","#c2410c","#be123c"];
let view="dash",step=0,draft={},docs={};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CACHE=S.get("misis_students",[]),DBX=null,ADMIN=false;
const db=()=>CACHE,PEND=()=>CACHE.filter(s=>s.status==="For Approval"||s.status==="Pending").length;
const rid=()=>"MISIS-"+new Date().getFullYear()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
const tg=s=>`<span class="tag ${s==="Enrolled"?"":s==="Rejected"?"x":"p"}">${s}</span>`;
const SC=()=>DBX.collection("students");
async function save(rec,dc){if(DBX){await SC().doc(rec.id).set(rec);for(const k in dc)await SC().doc(rec.id).collection("docs").doc(k).set({img:dc[k]})}else{CACHE=[...S.get("misis_students",[]),{...rec,docs:dc}];S.set("misis_students",CACHE)}}
async function getDocs(s){if(!DBX)return s.docs||{};const o={};await Promise.all((s.has||[]).map(async k=>{const d=await SC().doc(s.id).collection("docs").doc(k).get();if(d.exists)o[k]=d.data().img}));return o}
async function rm(id){if(DBX){const s=db().find(x=>x.id===id);for(const k of(s&&s.has)||[])await SC().doc(id).collection("docs").doc(k).delete();await SC().doc(id).delete()}else{CACHE=S.get("misis_students",[]).filter(s=>s.id!==id);S.set("misis_students",CACHE)}}
async function setSt(id,st){try{if(DBX)await SC().doc(id).update({status:st});else{CACHE=S.get("misis_students",[]).map(s=>s.id===id?{...s,status:st}:s);S.set("misis_students",CACHE)}toast("Marked "+st+".");closeD();go(view,1)}catch(e){toast("Failed: "+(e.message||e),1)}}
async function eraseAll(){if(!confirm("Erase ALL records?"))return;try{for(const s of[...db()])await rm(s.id);toast("All records erased.");go("set")}catch(e){toast("Failed: "+(e.message||e),1)}}
function appr(){LS="For Approval";list()}
function toast(m,bad){const t=$("#toast");t.textContent=m;t.style.background=bad?"var(--bad)":"var(--ok)";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3200)}
/* sidebar + swipe */
const side=$("#side"),ov=$("#ov");
const openS=o=>{side.classList.toggle("open",o);ov.classList.toggle("on",o)};
$("#mb").onclick=()=>openS(true);ov.onclick=()=>openS(false);
let tx=0,ty=0,tr=false;
addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tr=true},{passive:true});
addEventListener("touchend",e=>{if(!tr||innerWidth>=900)return;tr=false;const t=e.changedTouches[0],dx=t.clientX-tx,dy=Math.abs(t.clientY-ty);
if(dy>60)return;if(dx>70&&tx<40)openS(true);else if(dx<-60&&side.classList.contains("open"))openS(false)},{passive:true});
/* top bar theme */
function theme(i){document.documentElement.style.setProperty("--pri",COLS[i]);S.set("misis_theme",i)}
$("#sw").innerHTML=COLS.map((c,i)=>`<i style="background:${c}" data-i="${i}" title="Theme ${i+1}"></i>`).join("");

/* dashboard */
function dash(){const a=db(),en=a.filter(s=>s.status==="Enrolled").length;
const by={};a.forEach(s=>by[s.grade]=(by[s.grade]||0)+1);
$("#v").innerHTML=`<div class="card"><h2>Registrar Control Panel</h2><p style="color:var(--mut)">Development and Evaluation of a Computerized Enrollment System for Manuel I. Santos Integrated School. Swipe from the left edge on a phone to open the menu.</p><button class="btn" onclick="go('enroll')">Start enrollment</button></div>
<div class="grid"><div class="stat" style="cursor:pointer" onclick="go('list')"><b>${a.length}</b>Total records ›</div><div class="stat" style="background:var(--ok)"><b>${en}</b>Officially enrolled</div><div class="stat" style="background:#d68a00;cursor:pointer" onclick="go('appr')"><b>${PEND()}</b>Waiting for approval ›</div><div class="stat" style="background:#7b2cbf;cursor:pointer" onclick="showGrade(GR.find(g=>by[g])||'Grade 7')"><b>${Object.keys(by).length}</b>Grade levels ›</div></div>
<div class="card" style="margin-top:14px"><h3>Needs your approval</h3>${a.filter(s=>s.status==="For Approval"||s.status==="Pending").slice(-5).reverse().map(s=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)"><div style="flex:1"><b>${esc(s.last)}, ${esc(s.first)}</b><br><small style="color:var(--mut)">${s.grade} · ${s.id}</small></div><button class="btn" onclick="show('${s.id}')">Review</button></div>`).join("")||`<p style="color:var(--mut)">All caught up. No pending enrollments.</p>`}</div><div class="card"><h3>Enrollment by grade</h3>${Object.keys(by).length?GR.filter(g=>by[g]).map(g=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer" onclick="showGrade('${g}')"><span style="width:90px">${g}</span><div style="flex:1;background:var(--bd);border-radius:6px"><div style="height:14px;border-radius:6px;background:var(--pri);width:${by[g]/a.length*100}%;transition:width 1s"></div></div><b>${by[g]}</b></div>`).join(""):`<p style="color:var(--mut)">No students yet.</p>`}</div>
<div class="card"><h3>Required documents</h3><p>Every submission starts as <span class="tag p">For Approval</span>. The registrar reviews the PSA birth certificate, student ID or LRN slip, parent or guardian valid ID and report card, then marks it <span class="tag">Enrolled</span> or <span class="tag x">Rejected</span>.</p></div>`}
/* enroll form */
const STEPS=["Learner","Address","Family","Documents","Review"];
const SHS=g=>/^Grade 1[12]$/.test(g||"");
const AGE={"Grade 7":[11,15],"Grade 8":[12,16],"Grade 9":[13,17],"Grade 10":[14,18],"Grade 11":[15,19],"Grade 12":[16,20]};
const LBL={last:"Last name",first:"First name",dob:"Date of birth",sex:"Sex",pob:"Place of birth",prev:"Learner type",grade:"Grade",strand:"Strand",school:"Last school attended",addr:"Address",brgy:"Barangay",city:"City or municipality",prov:"Province",gname:"Guardian name",rel:"Relationship",gph:"Contact number"};
const REQ=[["last","first","dob","sex","pob","prev","grade"],["addr","brgy","city","prov"],["gname","rel","gph"],[],[]];
const NAMEOK=/^[A-Za-zÑñÁÉÍÓÚáéíóú .'’-]+$/;
draft=S.get("misis_draft",{});let consent=false,busy=false;
const SY=(()=>{const t=new Date(),y=t.getFullYear()-(t.getMonth()<5?1:0);return y+"–"+(y+1)})();
const ageOf=s=>{const t=new Date(),b=new Date(s);let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a};
function enroll(){const d=draft,v=k=>esc(d[k]||"");
const inp=(k,l,t="text",r=1,h="",x="")=>`<label>${l}${r?' <span class="req">*</span>':""}<input name="${k}" type="${t}" value="${v(k)}" ${x}>${h?`<small class="hint">${h}</small>`:""}</label>`;
const sel=(k,l,o,r=1)=>`<label>${l}${r?' <span class="req">*</span>':""}<select name="${k}"><option value="">Select</option>${o.map(x=>`<option ${d[k]===x?"selected":""}>${x}</option>`).join("")}</select></label>`;
const today=new Date().toISOString().slice(0,10);
const miss=DOCS.filter(x=>x[2]&&!docs[x[0]]).map(x=>x[1]);
const P=[`<div class="prep"><b>📋 Prepare these before you start</b><ul>${DOCS.map(([k,n,r])=>`<li>${n}${r?"":" <small>(optional)</small>"}</li>`).join("")}</ul></div><div class="f">${inp("lrn","LRN","text",0,"12 digits. Leave blank if you have none yet.",'inputmode="numeric" maxlength="12"')}${inp("last","Last name")}${inp("first","First name")}${inp("mid","Middle name","text",0)}${inp("dob","Date of birth","date",1,"",'max="'+today+'"')}${sel("sex","Sex",["Male","Female"])}${inp("pob","Place of birth")}${sel("prev","Learner type",["New","Transferee","Returning","Continuing"])}${sel("grade","Grade to enroll",GR)}<div id="stw" style="display:${SHS(d.grade)?"block":"none"}">${sel("strand","SHS strand",["STEM","ABM","HUMSS","GAS","TVL"])}</div>${inp("school","Last school attended","text",0,"Required for transferee, returning and continuing learners.")}</div>`,
`<div class="f">${inp("addr","House no., street, purok")}${inp("brgy","Barangay")}${inp("city","City or municipality")}${inp("prov","Province")}</div>`,
`<div class="f">${inp("fname","Father’s full name","text",0)}${inp("mname","Mother’s maiden name","text",0)}${sel("rel","Guardian relationship",["Mother","Father","Grandparent","Aunt/Uncle","Sibling","Other"])}${inp("gname","Guardian full name","text",1,"Auto-filled when you choose Mother or Father.")}${inp("gph","Contact number","tel",1,"Example: 09171234567",'inputmode="tel"')}${inp("gem","Email","email",0)}</div>`,
`<p style="color:var(--mut)">Take a clear photo or choose an image. <span class="req">*</span> means required.</p><div class="f">${DOCS.map(([k,n,r])=>`<div class="doc ${docs[k]?"has":""}">${docs[k]?`<img src="${docs[k]}" alt="">`:`<span style="font-size:30px">📄</span>`}<div><b>${n}${r?' <span class="req">*</span>':""}</b><br><small>${docs[k]?"Uploaded ✓":r?"Required":"Optional"}</small><br><label class="btn g" style="display:inline-block;padding:6px 12px;margin-top:6px;font-size:13px">${docs[k]?"Replace":"Choose photo"}<input type="file" accept="image/*" data-doc="${k}" hidden></label>${docs[k]?` <button type="button" class="btn r" style="padding:6px 12px;font-size:13px" onclick="rmDoc('${k}')">Remove</button>`:""}</div></div>`).join("")}</div>`,
`<div class="rev">${[["Learner",esc(d.first)+" "+esc(d.mid)+" "+esc(d.last)],["LRN",esc(d.lrn)||"None yet"],["Birth",esc(d.dob)+" · "+esc(d.pob)+" · "+esc(d.sex)],["Grade",esc(d.grade)+(d.strand?" · "+esc(d.strand):"")+" ("+esc(d.prev)+")"],["Last school",esc(d.school)||"–"],["Address",esc(d.addr)+", "+esc(d.brgy)+", "+esc(d.city)+", "+esc(d.prov)],["Guardian",esc(d.gname)+" ("+esc(d.rel)+") · "+esc(d.gph)],["Documents",DOCS.filter(x=>docs[x[0]]).length+" of "+DOCS.length+" uploaded"]].map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div>${miss.length?`<p class="warn">⚠ Missing required: ${miss.join(", ")}. You can still submit, but the registrar cannot approve it until they are complete.</p>`:`<p class="ok">✓ All required documents are uploaded.</p>`}<label class="chk"><input type="checkbox" id="cs" ${consent?"checked":""}><span>I confirm that the information is true and I agree to the school processing it under the Data Privacy Act of 2012.</span></label>`];
$("#v").innerHTML=`<div class="card"><div class="hero"><img class="logo" src="${LOGO}" alt=""><div><h2>Student Enrollment</h2><small>Manuel I. Santos Integrated School · SY ${SY}</small></div></div><div class="stp">${STEPS.map((s,i)=>`<div class="s ${i<step?"d":i===step?"c":""}"><b>${i<step?"✓":i+1}</b><span>${s}</span></div>`).join("")}</div><h3>${["Learner information","Home address","Parents and guardian","Required documents","Review and submit"][step]}</h3><form id="fm" onsubmit="return false">${P[step]}</form><div class="nb"><button class="btn g" ${step?"":"disabled"} onclick="mv(-1)">&#10096 Back</button>${step<4?`<button class="btn" onclick="mv(1)">Next &#10097;</button>`:`<button class="btn" id="sb" onclick="submitE()">Submit enrollment ✓</button>`}</div></div>`;
document.querySelectorAll("#fm [data-doc]").forEach(i=>i.onchange=()=>shrink(i.files[0],i.dataset.doc));
const gs=$("#fm [name=grade]");if(gs)gs.onchange=()=>{const s=SHS(gs.value);$("#stw").style.display=s?"block":"none";if(!s)$("#fm [name=strand]").value=""};
const rl=$("#fm [name=rel]");if(rl)rl.onchange=()=>{const g=$("#fm [name=gname]"),m=$("#fm [name=mname]").value.trim(),f=$("#fm [name=fname]").value.trim();if(rl.value==="Mother"&&m)g.value=m;else if(rl.value==="Father"&&f)g.value=f};
const cs=$("#cs");if(cs)cs.onchange=()=>consent=cs.checked;
const lr=$("#fm [name=lrn]");if(lr)lr.oninput=()=>lr.value=lr.value.replace(/\D/g,"");
document.querySelectorAll("#fm input,#fm select").forEach(e=>e.addEventListener("input",()=>e.classList.remove("bad")))}
function grab(){document.querySelectorAll("#fm [name]").forEach(e=>draft[e.name]=e.value.trim());S.set("misis_draft",draft)}
function check(i){const bad=k=>{const e=$("#fm [name="+k+"]");if(e){e.classList.add("bad");e.focus()}};const d=draft;
for(const k of REQ[i])if(!d[k]){bad(k);return "Please fill in: "+LBL[k]+"."}
if(i===0){
for(const k of["last","first","mid"])if(d[k]&&!NAMEOK.test(d[k])){bad(k);return LBL[k]+" should contain letters only."}
if(d.lrn&&!/^\d{12}$/.test(d.lrn)){bad("lrn");return "LRN must be exactly 12 digits."}
if(d.prev!=="New"&&!d.lrn){bad("lrn");return "LRN is required for "+d.prev.toLowerCase()+" learners."}
if(d.prev!=="New"&&!d.school){bad("school");return "Please enter the last school attended."}
const a=ageOf(d.dob);if(isNaN(a)||a<8||a>30||new Date(d.dob)>new Date()){bad("dob");return "Please enter a valid date of birth."}
if(SHS(d.grade)&&!d.strand){bad("strand");return "Please choose a strand for Grade 11–12."}
const o=S.get("misis_students",[]);
if(d.lrn&&o.some(s=>s.lrn===d.lrn)){bad("lrn");return "This LRN is already registered."}
if(o.some(s=>(s.last||"").toLowerCase()===d.last.toLowerCase()&&(s.first||"").toLowerCase()===d.first.toLowerCase()&&s.dob===d.dob)){bad("last");return "This learner is already registered."}}
if(i===2){if(!/^(\+63|0)9\d{9}$/.test((d.gph||"").replace(/[\s-]/g,""))){bad("gph");return "Enter a valid PH mobile number (e.g., 09171234567)."}
if(d.gem&&!/^\S+@\S+\.\S+$/.test(d.gem)){bad("gem");return "Please enter a valid email address."}}
return ""}
function mv(n){grab();if(n>0){const e=check(step);if(e){toast(e,1);return}
if(step===0){const r=AGE[draft.grade],a=ageOf(draft.dob);if(r&&(a<r[0]||a>r[1])&&!confirm("The learner is "+a+" years old, which is unusual for "+draft.grade+" (usually "+r[0]+"–"+r[1]+"). Continue?"))return}}
step=Math.max(0,Math.min(4,step+n));enroll();scrollTo(0,0)}
function rmDoc(k){delete docs[k];enroll()}
function shrink(f,k){if(!f)return;if(!/^image\//.test(f.type)){toast("Please choose an image file (JPG or PNG).",1);return}if(f.size>15e6){toast("Image is too large (max 15 MB).",1);return}
const r=new FileReader();r.onload=()=>{const im=new Image();im.onerror=()=>toast("That image could not be read.",1);im.onload=()=>{const m=560,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);docs[k]=c.toDataURL("image/jpeg",.6);enroll()};im.src=r.result};r.readAsDataURL(f)}
function submitE(){if(busy)return;grab();if(!consent){toast("Please tick the confirmation box.",1);return}
for(let i=0;i<3;i++){const e=check(i);if(e){step=i;enroll();setTimeout(()=>toast(e,1),60);return}}
if(!SHS(draft.grade))draft.strand="";
const miss=DOCS.filter(d=>d[2]&&!docs[d[0]]).map(d=>d[1]);
if(miss.length&&!confirm("Missing required documents:\n- "+miss.join("\n- ")+"\n\nSubmit anyway?"))return;
busy=true;$("#sb").disabled=true;const rec={...draft,id:rid(),status:"For Approval",missing:miss,has:Object.keys(docs),date:new Date().toISOString()};
save(rec,{...docs}).then(()=>{S.set("misis_draft",{});draft={};docs={};step=0;consent=false;busy=false;done(rec,miss)}).catch(e=>{busy=false;toast("Could not submit: "+(e.message||e),1);enroll()})}
function done(r,miss){$("#v").innerHTML=`<div class="card" style="text-align:center"><img class="logo" style="width:96px;height:96px" src="${LOGO}" alt=""><h2>Enrollment submitted!</h2><p style="color:var(--mut)">Your enrollment number</p><h1 class="no">${r.id}</h1>${tg("For Approval")}<p><b>${esc(r.last)}, ${esc(r.first)}</b> · ${esc(r.grade)}${r.strand?" · "+esc(r.strand):""}</p>${miss.length?`<p class="warn">Please bring the missing documents to the registrar: ${miss.join(", ")}.</p>`:""}<p style="color:var(--mut)">Keep this number. The registrar will review your enrollment.</p><div class="noprint" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn g" onclick="print()">🖨 Print receipt</button><button class="btn" onclick="go('enroll')">Enroll another student</button></div></div>`;toast("Submitted! Waiting for approval.");scrollTo(0,0)}
/* list */
function list(q=""){const a=db().filter(s=>(!LG||s.grade===LG)&&(!LS||s.status===LS)&&(s.last+s.first+s.id+s.grade+(s.lrn||"")).toLowerCase().includes(q.toLowerCase()));
$("#v").innerHTML=`<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q" placeholder="Search name, grade, LRN, number" value="${esc(q)}" style="flex:1;min-width:200px;margin:0"><button class="btn noprint" onclick="print()">Print</button><select class="noprint" style="width:auto;margin:0" onchange="LS=this.value;list($('#q').value)">${["","For Approval","Enrolled","Rejected"].map(x=>`<option value="${x}" ${LS===x?"selected":""}>${x||"All statuses"}</option>`).join("")}</select><div class="noprint" style="display:flex;gap:6px;flex-wrap:wrap;width:100%"><button class="btn ${LG?"g":""}" onclick="showGrade('')">All (${db().length})</button>${GR.map(g=>`<button class="btn ${LG===g?"":"g"}" onclick="showGrade('${g}')">${g} (${db().filter(s=>s.grade===g).length})</button>`).join("")}</div></div></div>
<div class="card tbl"><table><tr><th>No.</th><th>Learner</th><th>LRN</th><th>Grade</th><th>Sex</th><th>Guardian</th><th>Contact</th><th>Status</th><th></th></tr>${a.map((s,i)=>`<tr class="row" style="animation-delay:${i*40}ms"><td>${s.id}</td><td>${esc(s.last)}, ${esc(s.first)}</td><td>${esc(s.lrn)||"–"}</td><td>${s.grade}${s.strand?" · "+s.strand:""}</td><td>${s.sex}</td><td>${esc(s.gname)}</td><td>${esc(s.gph)}</td><td>${tg(s.status)}</td><td><button class="btn g" onclick="show('${s.id}')">View</button></td></tr>`).join("")||`<tr><td colspan="9" style="color:var(--mut)">No records found.</td></tr>`}</table></div>`;
const i=$("#q");i.oninput=()=>{const p=i.selectionStart;list(i.value);const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
async function show(id){const s=db().find(x=>x.id===id);if(!s)return;const dc=await getDocs(s);
$("#dc").innerHTML=`<img class="logo" style="width:60px;height:60px" src="${LOGO}" alt=""><h2>${esc(s.first)} ${esc(s.mid)} ${esc(s.last)}</h2>${tg(s.status)} <small>${s.id}</small>
<p><b>${s.grade}</b> ${s.strand?"· "+s.strand:""} · ${s.prev}<br>LRN: ${esc(s.lrn)||"n/a"} · Born ${esc(s.dob)} in ${esc(s.pob)} · ${s.sex}<br>${esc(s.addr)}, ${esc(s.brgy)}, ${esc(s.city)}, ${esc(s.prov)}<br>Guardian: ${esc(s.gname)} (${s.rel}) ${esc(s.gph)}<br>Father: ${esc(s.fname)||"n/a"} · Mother: ${esc(s.mname)||"n/a"}<br>Last school: ${esc(s.school)||"n/a"}</p>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${DOCS.map(d=>`<div style="text-align:center;font-size:12px">${dc[d[0]]?`<img src="${dc[d[0]]}" style="width:100%;border-radius:8px" alt="">`:`<div style="padding:24px 0;background:var(--bd);border-radius:8px">Missing</div>`}${d[1]}</div>`).join("")}</div>
<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn g" onclick="closeD()">Close</button>${s.status!=="Enrolled"?`<button class="btn" style="background:var(--ok)" ${DOCS.some(d=>d[2]&&!dc[d[0]])?"disabled":""} onclick="setSt('${s.id}','Enrolled')">✓ Approve</button>`:""}${s.status!=="Rejected"?`<button class="btn r" onclick="setSt('${s.id}','Rejected')">Reject</button>`:""}<button class="btn g" style="color:var(--bad)" onclick="del('${s.id}')">Delete</button></div>${DOCS.some(d=>d[2]&&!dc[d[0]])?`<p class="req">Approval is locked until all required documents are uploaded.</p>`:""}`;$("#dlg").classList.add("on")}
const closeD=()=>$("#dlg").classList.remove("on");$("#dlg").onclick=e=>{if(e.target.id==="dlg")closeD()};
async function del(id){if(!confirm("Delete this record permanently?"))return;try{await rm(id);closeD();toast("Record deleted.");go(view,1)}catch(e){toast("Failed: "+(e.message||e),1)}}
/* evaluation (ISO 25010 style) */
const QS=["Functional suitability: the system does what enrollment needs","Performance: pages respond quickly","Usability: easy to learn and use","Reliability: records are saved correctly","Security: documents and data feel protected","Compatibility: works on my device"];
function evalv(){const ev=S.get("misis_eval",[]);const avg=QS.map((_,i)=>ev.length?(ev.reduce((t,e)=>t+e.r[i],0)/ev.length).toFixed(2):"–");
$("#v").innerHTML=`<div class="card"><h2>Rate this system</h2><label>Your role<select id="role"><option>Student</option><option>Parent</option><option>Teacher</option><option>Registrar/Admin</option></select></label>${QS.map((q,i)=>`<p>${q}<br><span class="stars" data-q="${i}">${[1,2,3,4,5].map(n=>`<button data-n="${n}">☆</button>`).join("")}</span></p>`).join("")}<button class="btn" onclick="sendEv()">Submit evaluation</button></div>
<div class="card"><h3>Results (${ev.length} respondents)</h3>${QS.map((q,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span>${q.split(":")[0]}</span><b>${avg[i]} / 5</b></div>`).join("")}</div>`;
window.R=Array(6).fill(0);document.querySelectorAll(".stars").forEach(g=>g.onclick=e=>{const n=+e.target.dataset.n;if(!n)return;R[g.dataset.q]=n;[...g.children].forEach((b,i)=>b.textContent=i<n?"★":"☆")})}
function sendEv(){if(R.includes(0)){toast("Please rate every item.",1);return}const ev=S.get("misis_eval",[]);ev.push({role:$("#role").value,r:[...R]});S.set("misis_eval",ev);toast("Thank you for your feedback!");evalv()}
/* settings */
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function set(){$("#v").innerHTML=`<div class="card"><h2>Settings & data</h2><p style="color:var(--mut)">Records are saved in the shared school database. Export regularly for backup.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="csv()">Export CSV</button><button class="btn g" onclick="dl('misis-backup.json',JSON.stringify(db()),'application/json')">Backup JSON</button><button class="btn r" onclick="eraseAll()">Erase all</button></div></div>
<div class="card"><h3>School logo</h3><p style="color:var(--mut)">Upload a higher-resolution logo to replace the current one.</p><input type="file" accept="image/*" id="lg"></div>`;
$("#lg").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.querySelectorAll("img.logo").forEach(i=>i.src=r.result);toast("Logo updated for this session.")};r.readAsDataURL(f)}}
function csv(){const h=["id","status","last","first","mid","lrn","dob","sex","grade","strand","prev","addr","brgy","city","prov","gname","rel","gph","gem"];
dl("misis-students.csv",[h.join(",")].concat(db().map(s=>h.map(k=>'"'+String(s[k]||"").replace(/"/g,'""')+'"').join(","))).join("\n"),"text/csv")}
ADMIN=false;nav();go("enroll");
</script></body></html>
